[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules group their imports under section banners next to the tests
# they belong to, which reads better than one hoisted block at the top.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# `eval/` and `scripts/` are directories of standalone entry points, not
# packages — no `__init__.py`, and several manipulate `sys.path` to import the
# app. Without this, mypy maps `eval/config_loader.py` to both `config_loader`
# and `eval.config_loader`, calls that a duplicate, and aborts the whole run
# before type-checking anything ("Source file found twice under different
# module names"). This flag is mypy-only — unlike adding `__init__.py`, it has
# no effect on runtime import resolution, so the entry points keep working
# exactly as they did.
explicit_package_bases = true
# Local-only noise: CI installs into the runner's Python, so there is no venv
# to crawl there, but a local `mypy .` otherwise type-checks site-packages'
# stray scripts (e.g. pywin32_postinstall.py).
exclude = ['^venv/', '^\.venv/']
