name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── High-scrutiny file changes ────────────────────────────────────────
  # See docs/scaling-tech-challenges.md, Security Vulnerabilities #10:
  # AGENTS.md/CLAUDE.md instruct AI coding agents to consult specific repo
  # paths — a compromised dependency or malicious PR could plant similar
  # "agent instructions" that get silently obeyed. Flag any PR touching
  # these files for mandatory human (not AI-agent) review.
  agent-instructions-changed:
    name: Flag AGENTS.md / CLAUDE.md changes for review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AGENTS.md / CLAUDE.md changes
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '**/AGENTS.md' '**/CLAUDE.md')
          if [ -n "$changed" ]; then
            echo "::warning::This PR modifies AI-agent instruction file(s): $changed — requires a second human reviewer per repo policy (see .github/CODEOWNERS). Do not let an AI agent auto-approve these changes."
          fi

  # ─── Secret scanning ────────────────────────────────────────────────────
  # See docs/scaling-tech-challenges.md, "Now (any traffic)" risk bucket:
  # catch committed API keys/tokens before merge, not after a leak.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Backend ───────────────────────────────────────────────────────────
  backend-lint-and-test:
    name: Backend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy . --ignore-missing-imports

      - name: Fail on wildcard ALLOWED_ORIGINS
        working-directory: ${{ github.workspace }}
        run: |
          if grep -RInE 'ALLOWED_ORIGINS\s*=\s*"?\*' --include='*.env*' --include='*.yml' --include='*.yaml' --include='*.toml' . 2>/dev/null | grep -v '\.example'; then
            echo "::error::ALLOWED_ORIGINS must not contain a wildcard ('*') in any committed env/deploy config."
            exit 1
          fi

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        # Advisory only for now: this surfaced pre-existing transitive CVEs
        # (starlette/python-multipart pulled in by the pinned fastapi/uvicorn
        # versions) that need a dedicated upgrade effort, not a silent CI
        # block. Flip to blocking once those are remediated.
        run: pip-audit -r requirements.txt || echo "::warning::pip-audit found known vulnerabilities — see job log. Non-blocking until existing findings are remediated."

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          QDRANT_URL: http://localhost:6333
          LLM_PROVIDER: mock
          GROQ_API_KEY: test-key-ci
          # JSON, not a bare string: `allowed_origins` is a `list[str]`, and
          # pydantic-settings parses complex fields from env as JSON — a bare
          # value raises SettingsError before a single test runs.
          ALLOWED_ORIGINS: '["http://localhost:3000"]'

  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend-lint-and-test:
    name: Frontend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # NOTE: there is no ESLint config in apps/web — `lint` is currently
      # `tsc --noEmit`, so this step and the next one do the same thing. Left
      # as two steps rather than silently dropping one; wire `lint` to a real
      # ESLint config to make the distinction real.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Audit dependencies for known vulnerabilities (npm audit)
        # Advisory only, matching the backend pip-audit job — flip to
        # blocking once any pre-existing findings are triaged/remediated.
        run: npm audit --audit-level=high || echo "::warning::npm audit found known vulnerabilities — see job log."

      - name: Unit & component tests (Vitest)
        run: npm run test -- --run

      # Build here, not only in the e2e job. A Next production build is the
      # only thing that prerenders pages, so it catches a whole class of bug
      # that `next dev`, tsc and vitest all miss — v10.55.0 shipped a page
      # that dereferenced a client-only API during prerender and broke the
      # Vercel deploy while every other check was green. The e2e job also
      # builds, but it `needs` the backend job, so a backend failure silently
      # takes the build check down with it.
      - name: Build (production, catches prerender errors)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─── E2E (runs on merge to main only) ──────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-lint-and-test, frontend-lint-and-test]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # requirements-dev.txt too, matching the backend test job. `db.py`
      # builds the async engine at import time from `settings.database_url`,
      # which defaults to `sqlite+aiosqlite:///./dev.db` — and **aiosqlite is
      # a dev dependency**, because prod runs Postgres on asyncpg. Installing
      # only requirements.txt therefore makes `import main` raise
      # ModuleNotFoundError before uvicorn can bind a port. Do not "fix" this
      # by moving aiosqlite into requirements.txt: that ships a driver to
      # production that production must never use.
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: apps/api

      # 🔴 A backgrounded `run:` step reports success no matter what happens to
      # the process. `uvicorn main:app &` returns the shell's exit code, not
      # the server's, so a hard import-time crash left a green checkmark on
      # this step and surfaced 30s later as a `wait-on` timeout in a different
      # step — which reads as a flaky/slow service, not a broken build. That
      # misdirection is why the E2E job sat red for 8 consecutive runs on main.
      # Anything started with `&` must therefore be waited for *here*, and must
      # print its own log and fail this step when it does not come up.
      - name: Start backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          api_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend healthy (pid $api_pid)."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::Backend process died during startup — log follows."
              cat /tmp/api.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Backend did not answer /health within 60s — log follows."
          cat /tmp/api.log
          exit 1
        working-directory: apps/api
        env:
          QDRANT_URL: http://localhost:6333
          LLM_PROVIDER: mock
          GROQ_API_KEY: test-key-ci
          # JSON — see the note on the same variable in the backend test job.
          ALLOWED_ORIGINS: '["http://localhost:3000"]'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build Next.js
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # Same contract as "Start backend" above — background it, then block
      # here until it answers, and surface its own log on failure. Replaces
      # the old shared `wait-on` step, which could only report *that* a
      # service was unreachable, never which one or why.
      - name: Start frontend
        run: |
          npm run start > /tmp/web.log 2>&1 &
          web_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend healthy (pid $web_pid)."
              exit 0
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              echo "::error::Frontend process died during startup — log follows."
              cat /tmp/web.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::Frontend did not answer on :3000 within 60s — log follows."
          cat /tmp/web.log
          exit 1
        working-directory: apps/web

      - name: Run Playwright E2E tests
        run: npx playwright test
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
